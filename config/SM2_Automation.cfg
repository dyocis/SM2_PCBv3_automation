#####################################################################
# Nevermore StealthMax Automation V3.5
#
# Priority:
#
# 1 Safety (SM2_Control)
# 2 VOC Emergency
# 3 Chamber Cooling
# 4 Print Filtration
# 5 Heavy VOC
# 6 Normal Filtration
# 7 Idle
#
#####################################################################
# STATUS
#####################################################################

[gcode_macro NEVERMORE_STATUS]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set temp_in = printer["temperature_sensor BME_IN"].temperature %}
    {% set temp_out = printer["temperature_sensor BME_OUT"].temperature %}
    {% set voc_in = printer["temperature_sensor SGP_IN"].temperature %}
    {% set voc_out = printer["temperature_sensor SGP_OUT"].temperature %}
    {% set temp_delta = temp_in - temp_out %}
    {% set voc_delta = voc_in - voc_out %}
    {% set rpm = printer["fan_generic Filter"].rpm %}
    {% set fan = printer["fan_generic Filter"].speed %}
    {% set has_uv = "output_pin uv" in printer %}
    {% set has_peltier = "output_pin peltier" in printer %}
    {% set has_vent = "servo SM_Vent" in printer %}

    {% set chamber_off = (sm.chamber_target|float) - (sm.chamber_hysteresis|float) %}
    {% set voc_idle = [0, (sm.voc_warning|float) - (sm.voc_idle_hysteresis|float)]|max %}

    RESPOND MSG="AUTO={sm.auto_mode} FAULT={sm.fault} MANUAL={sm.manual_override} MODE={sm.auto_reason}"
    RESPOND MSG="TEMP_IN={temp_in|round(1)} TEMP_OUT={temp_out|round(1)} dT={temp_delta|round(1)}C"
    RESPOND MSG="VOC_IN={voc_in|int} VOC_OUT={voc_out|int} dVOC={voc_delta|int}"
    RESPOND MSG="HYST CHAMBER={sm.chamber_target|round(1)}/{chamber_off|round(1)}C LATCH={sm.chamber_cooling_latched} VOC_STATE={sm.voc_state} IDLE_CLEAR={voc_idle|int}"
    RESPOND MSG="CAPABILITIES UV={'YES' if has_uv else 'NO'} PELTIER={'YES' if has_peltier else 'NO'} VENT_SERVO={'YES' if has_vent else 'NO'}"
    RESPOND MSG="FAN={fan|round(2)} CMD={sm.last_filter_speed|round(2)} RPM={rpm|int} UV={sm.uv if has_uv else 'N/A'} PELTIER={sm.peltier if has_peltier else 'N/A'} VENT={('OPEN' if sm.vent_open|int == 1 else 'CLOSED') if has_vent else 'N/A'}"
    RESPOND MSG="INTERLOCK={sm.peltier_interlock_state} VENT_READY={sm.vent_closed_ready} COOLDOWN={sm.peltier_cooldown_active} VENT_PENDING={sm.vent_pending_open} PELTIER_PENDING={sm.peltier_pending_on}"
    RESPOND MSG="SGP40_CAL ACTIVE={sm.sgp40_calibration_active} HOLD={sm.sgp40_calibration_hold} PHASE={sm.sgp40_calibration_phase} REMAINING={sm.sgp40_calibration_remaining|int}s REV={sm.sgp40_calibration_revision|int} RESET_PENDING={sm.sgp40_calibration_reset_applied|int}"


#####################################################################
# ENABLE / DISABLE
#####################################################################

[gcode_macro NEVERMORE_AUTO_ENABLE]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        { action_raise_error("Automatic control rejected: SGP40 clean-air calibration is active") }
    {% endif %}

    {% if sm.sgp40_calibration_reset_applied|int == 1 %}
        { action_raise_error("Automatic control rejected: run FIRMWARE_RESTART to restore the last saved SGP40 baseline") }
    {% endif %}

    {% if sm.sgp40_calibration_hold|int == 1 or sm.sgp40_calibration_phase != "IDLE" %}
        SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"IDLE"'
        SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE=0
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"IDLE"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_mode VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=manual_override VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"IDLE"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"IDLE"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"AUTO ENABLED"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_state VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_cooling_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0

    UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
    VENT_CLOSE AUTO=1 FORCE=1
    NEVERMORE_UPDATE_SENSORS
    UPDATE_DELAYED_GCODE ID=NEVERMORE_AUTO_CONTROL DURATION=1


[gcode_macro NEVERMORE_AUTO_DISABLE]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_mode VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=print_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=purge_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"DISABLED"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_state VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_cooling_latched VALUE=0

    NEVERMORE_OFF

    RESPOND MSG="Nevermore AUTO disabled"


[gcode_macro NEVERMORE_MANUAL]
gcode:
    {% set preserve_vent = params.PRESERVE_VENT|default(0)|int %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=manual_override VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_mode VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"MANUAL"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"MANUAL OVERRIDE"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_state VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_cooling_latched VALUE=0

    {% if preserve_vent == 0 %}
        VENT_CLOSE AUTO=1
    {% endif %}

    RESPOND MSG="Nevermore manual override enabled"


#####################################################################
# PRINT START
#####################################################################

[gcode_macro NEVERMORE_PRINT_START]
description: Start Nevermore print automation; optionally select FILAMENT or MATERIAL
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% if params.FILAMENT is defined or params.MATERIAL is defined %}
        NEVERMORE_SET_MATERIAL MATERIAL={params.FILAMENT|default(params.MATERIAL)|string}
    {% endif %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        { action_raise_error("Print start rejected: SGP40 clean-air calibration is active") }
    {% endif %}

    {% if sm.sgp40_calibration_reset_applied|int == 1 %}
        { action_raise_error("Print start rejected: run FIRMWARE_RESTART to restore the last saved SGP40 baseline") }
    {% endif %}

    {% if sm.sgp40_calibration_hold|int == 1 or sm.sgp40_calibration_phase != "IDLE" %}
        SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"IDLE"'
        SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE=0
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"IDLE"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=print_active VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_mode VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=manual_override VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"PRINT FILTRATION"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_state VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_cooling_latched VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0

    UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
    VENT_CLOSE AUTO=1
    NEVERMORE_FILTER SPEED={printer["gcode_macro SM_LED_STATE"].print_filter}
    UPDATE_SM_STATUS_LEDS


#####################################################################
# PRINT END
#####################################################################

[gcode_macro NEVERMORE_PRINT_END]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=print_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=purge_active VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"POST PRINT PURGE"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"POST PRINT PURGE"'

    VENT_OPEN AUTO=1
    RESPOND MSG="Nevermore adaptive purge started"


#####################################################################
# AUTOMATION ENGINE
#####################################################################

[delayed_gcode NEVERMORE_AUTO_CONTROL]
initial_duration: 10
gcode:
    NEVERMORE_UPDATE_SENSORS

    {% if printer["gcode_macro SM_LED_STATE"].auto_mode|int == 1
          and printer["gcode_macro SM_LED_STATE"].manual_override|int == 0
          and printer["gcode_macro SM_LED_STATE"].purge_active|int == 0
          and printer["gcode_macro SM_LED_STATE"].fault|int == 0 %}

        {% set sm = printer["gcode_macro SM_LED_STATE"] %}
        {% set temp = printer["temperature_sensor BME_IN"].temperature|float %}
        {% set voc = printer["temperature_sensor SGP_IN"].temperature|float %}
        {% set previous = sm.auto_reason %}
        {% set has_vent = "servo SM_Vent" in printer %}
        {% set has_peltier = "output_pin peltier" in printer %}

        # Chamber hysteresis:
        #   enter cooling at chamber_target
        #   leave cooling at chamber_target - chamber_hysteresis
        {% set chamber_on = sm.chamber_target|float %}
        {% set chamber_off = chamber_on - (sm.chamber_hysteresis|float) %}
        {% set old_chamber_state = sm.chamber_cooling_latched|int %}

        {% if temp >= chamber_on %}
            {% set chamber_state = 1 %}
        {% elif old_chamber_state == 1 and temp > chamber_off %}
            {% set chamber_state = 1 %}
        {% else %}
            {% set chamber_state = 0 %}
        {% endif %}

        # VOC hysteresis uses the next lower material-profile threshold
        # as the recovery point.  The normal state clears below
        # voc_warning - voc_idle_hysteresis.
        {% set voc_warning = sm.voc_warning|float %}
        {% set voc_high = sm.voc_high|float %}
        {% set voc_emergency = sm.voc_emergency|float %}
        {% set voc_idle = [0, voc_warning - (sm.voc_idle_hysteresis|float)]|max %}
        {% set old_voc_state = sm.voc_state|int %}

        {% if voc >= voc_emergency %}
            {% set voc_state = 3 %}
        {% elif old_voc_state == 3 and voc > voc_high %}
            {% set voc_state = 3 %}
        {% elif voc >= voc_high %}
            {% set voc_state = 2 %}
        {% elif old_voc_state >= 2 and voc > voc_warning %}
            {% set voc_state = 2 %}
        {% elif voc >= voc_warning %}
            {% set voc_state = 1 %}
        {% elif old_voc_state >= 1 and voc > voc_idle %}
            {% set voc_state = 1 %}
        {% else %}
            {% set voc_state = 0 %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_cooling_latched VALUE={chamber_state}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_state VALUE={voc_state}

        {% if voc_state == 3 %}

            {% set reason = "VOC EMERGENCY" %}
            NEVERMORE_FILTER SPEED=1
            NEVERMORE_UV VALUE=1 AUTO=1
            {% if chamber_state == 1 or not has_peltier %}
                VENT_OPEN AUTO=1
            {% else %}
                VENT_CLOSE AUTO=1
                NEVERMORE_PELTIER VALUE=1 AUTO=1
            {% endif %}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"VOC EMERGENCY"'

        {% elif chamber_state == 1 %}

            {% set reason = "CHAMBER COOLING" if has_vent else "CHAMBER HIGH - NO VENT" %}
            NEVERMORE_FILTER SPEED=1
            NEVERMORE_UV VALUE=0 AUTO=1
            VENT_OPEN AUTO=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"{reason}"'

        {% elif sm.print_active|int == 1 %}

            {% set reason = "PRINT FILTRATION" %}
            NEVERMORE_FILTER SPEED={sm.print_filter}
            NEVERMORE_UV VALUE=0 AUTO=1
            NEVERMORE_PELTIER VALUE=0 AUTO=1
            VENT_CLOSE AUTO=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"PRINT FILTRATION"'

        {% elif voc_state == 2 %}

            {% set reason = "HEAVY VOC" %}
            NEVERMORE_FILTER SPEED=1
            NEVERMORE_UV VALUE=0 AUTO=1
            NEVERMORE_PELTIER VALUE=0 AUTO=1
            VENT_CLOSE AUTO=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"HEAVY VOC"'

        {% elif voc_state == 1 %}

            {% set reason = "NORMAL FILTRATION" %}
            NEVERMORE_FILTER SPEED=0.6
            NEVERMORE_UV VALUE=0 AUTO=1
            NEVERMORE_PELTIER VALUE=0 AUTO=1
            VENT_CLOSE AUTO=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"NORMAL FILTRATION"'

        {% else %}

            {% set reason = "IDLE" %}
            NEVERMORE_FILTER SPEED=0
            NEVERMORE_UV VALUE=0 AUTO=1
            NEVERMORE_PELTIER VALUE=0 AUTO=1
            VENT_CLOSE AUTO=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"IDLE"'

        {% endif %}

        {% if reason != previous %}

            RESPOND MSG="Nevermore AUTO: {reason}"

            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"{reason}"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"{reason}"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"{reason}"'

            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action_time VALUE={printer.print_stats.total_duration}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_update VALUE={printer.print_stats.total_duration}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action_clock VALUE='"{printer.print_stats.total_duration|int}s"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=transition_count VALUE={printer["gcode_macro SM_LED_STATE"].transition_count|int + 1}

        {% endif %}

    {% endif %}

    UPDATE_DELAYED_GCODE ID=NEVERMORE_AUTO_CONTROL DURATION=15


#####################################################################
# ADAPTIVE PURGE
#####################################################################

[delayed_gcode NEVERMORE_PURGE_CONTROL]
initial_duration: 20
gcode:
    {% if printer["gcode_macro SM_LED_STATE"].purge_active|int == 1 %}

        {% set sm = printer["gcode_macro SM_LED_STATE"] %}
        {% set voc = printer["temperature_sensor SGP_IN"].temperature|float %}
        {% set voc_warning = sm.voc_warning|float %}
        {% set voc_high = sm.voc_high|float %}
        {% set voc_emergency = sm.voc_emergency|float %}
        {% set voc_idle = [0, voc_warning - (sm.voc_idle_hysteresis|float)]|max %}
        {% set old_voc_state = sm.voc_state|int %}

        # Apply the same stateful VOC bands used by the main automation
        # so UV, Peltier, and purge completion do not chatter at a limit.
        {% if voc >= voc_emergency %}
            {% set voc_state = 3 %}
        {% elif old_voc_state == 3 and voc > voc_high %}
            {% set voc_state = 3 %}
        {% elif voc >= voc_high %}
            {% set voc_state = 2 %}
        {% elif old_voc_state >= 2 and voc > voc_warning %}
            {% set voc_state = 2 %}
        {% elif voc >= voc_warning %}
            {% set voc_state = 1 %}
        {% elif old_voc_state >= 1 and voc > voc_idle %}
            {% set voc_state = 1 %}
        {% else %}
            {% set voc_state = 0 %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_state VALUE={voc_state}

        {% if voc_state == 3 %}

            NEVERMORE_FILTER SPEED=1
            NEVERMORE_UV VALUE=1 AUTO=1
            VENT_OPEN AUTO=1

        {% elif voc_state == 2 %}

            NEVERMORE_FILTER SPEED=1
            NEVERMORE_UV VALUE=1 AUTO=1
            VENT_OPEN AUTO=1

        {% elif voc_state == 1 %}

            NEVERMORE_FILTER SPEED=0.6
            NEVERMORE_UV VALUE=0 AUTO=1
            VENT_OPEN AUTO=1

        {% else %}

            NEVERMORE_OFF

            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=purge_active VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"IDLE"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"IDLE"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"PURGE COMPLETE"'

            RESPOND MSG="Nevermore purge complete"

        {% endif %}

    {% endif %}

    UPDATE_DELAYED_GCODE ID=NEVERMORE_PURGE_CONTROL DURATION=15


#####################################################################
# UNATTENDED SGP40 CLEAN-AIR CALIBRATION
#####################################################################

[gcode_macro NEVERMORE_SGP_CALIBRATION_START]
description: Prepare and run an unattended 24-hour calibration of both SGP40 sensors
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set duration = sm.sgp40_calibration_duration|int %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        RESPOND MSG="SGP40 calibration is already active"
    {% elif sm.fault|int == 1 %}
        { action_raise_error("SGP40 calibration rejected: clear the Nevermore fault first") }
    {% elif print_state in ["printing", "paused"] or sm.print_active|int == 1 or sm.purge_active|int == 1 %}
        { action_raise_error("SGP40 calibration rejected: the printer or post-print purge is active") }
    {% else %}
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_PREP DURATION=0
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_GUARD DURATION=0
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_TICK DURATION=0
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_FINISH DURATION=0

        # Shut down first so an existing Peltier cycle can enter its normal
        # 60-second airflow cooldown before the calibration latch is set.
        NEVERMORE_MANUAL
        NEVERMORE_OFF

        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"COOLING"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE={duration}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_reset_applied VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 PREPARING"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 PREPARING"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"SGP40 CALIBRATION ARMED"'

        SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=1
        SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=1
        SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"COOLING"'
        SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE={duration}
        SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE=0

        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_PREP DURATION=5
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_GUARD DURATION=5
        RESPOND MSG="SGP40 calibration armed; waiting for the printer, chamber, and Nevermore to become fully inactive"
    {% endif %}


[delayed_gcode SGP40_CALIBRATION_PREP]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set extruder_temp = printer.extruder.temperature|float %}
    {% set extruder_target = printer.extruder.target|float %}
    {% set bed_temp = printer.heater_bed.temperature|float %}
    {% set bed_target = printer.heater_bed.target|float %}
    {% set chamber_temp = printer["temperature_sensor BME_IN"].temperature|float %}
    {% set fan_speed = printer["fan_generic Filter"].speed|float %}
    {% set fan_rpm = printer["fan_generic Filter"].rpm|float %}

    {% if sm.sgp40_calibration_active|int == 1 and sm.sgp40_calibration_phase == "COOLING" %}
        {% if print_state in ["printing", "paused"] or extruder_target > 0 or bed_target > 0 %}
            NEVERMORE_SGP_CALIBRATION_ABORT REASON=PRINT_OR_HEATER_ACTIVITY

        {% elif sm.peltier_cooldown_active|int == 1
              or sm.uv|int == 1
              or sm.peltier|int == 1
              or sm.vent_open|int == 1
              or sm.vent_closed_ready|int == 0
              or fan_speed > 0.01
              or fan_rpm > 200
              or extruder_temp > 50
              or bed_temp > 40
              or chamber_temp > 35 %}
            UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_PREP DURATION=30

        {% else %}
            RESET_SGP40 SENSOR=SGP_IN
            RESET_SGP40 SENSOR=SGP_OUT

            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"CALIBRATING"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE={sm.sgp40_calibration_duration|int}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_reset_applied VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 CALIBRATION"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 CALIBRATION"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"SGP40 CALIBRATION STARTED"'

            SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"CALIBRATING"'
            SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE={sm.sgp40_calibration_duration|int}
            SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE=1

            UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_TICK DURATION=60
            UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_FINISH DURATION={sm.sgp40_calibration_duration|int}
            RESPOND MSG="SGP40 clean-air calibration started; both baselines will be saved automatically after 24 hours"
        {% endif %}
    {% endif %}


[delayed_gcode SGP40_CALIBRATION_GUARD]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set fan_speed = printer["fan_generic Filter"].speed|float %}
    {% set fan_rpm = printer["fan_generic Filter"].rpm|float %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        {% if print_state in ["printing", "paused"]
              or printer.extruder.target|float > 0
              or printer.heater_bed.target|float > 0 %}
            NEVERMORE_SGP_CALIBRATION_ABORT REASON=PRINT_OR_HEATER_ACTIVITY

        {% elif sm.sgp40_calibration_phase == "CALIBRATING"
              and (sm.uv|int == 1
                   or sm.peltier|int == 1
                   or sm.vent_open|int == 1
                   or fan_speed > 0.01
                   or fan_rpm > 200) %}
            NEVERMORE_SGP_CALIBRATION_ABORT REASON=NEVERMORE_OUTPUT_ACTIVITY

        {% else %}
            UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_GUARD DURATION=5
        {% endif %}
    {% endif %}


[delayed_gcode SGP40_CALIBRATION_TICK]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% if sm.sgp40_calibration_active|int == 1 and sm.sgp40_calibration_phase == "CALIBRATING" %}
        {% set remaining = [0, sm.sgp40_calibration_remaining|int - 60]|max %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE={remaining}

        {% if remaining > 0 %}
            UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_TICK DURATION=60
        {% endif %}
    {% endif %}


[delayed_gcode SGP40_CALIBRATION_FINISH]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set fan_speed = printer["fan_generic Filter"].speed|float %}
    {% set fan_rpm = printer["fan_generic Filter"].rpm|float %}
    {% set saved = printer.save_variables.variables %}
    {% set revision = saved.sgp40_calibration_revision|default(sm.sgp40_calibration_revision)|int + 1 %}

    {% if sm.sgp40_calibration_active|int == 1 and sm.sgp40_calibration_phase == "CALIBRATING" %}
        {% if print_state in ["printing", "paused"]
              or printer.extruder.target|float > 0
              or printer.heater_bed.target|float > 0
              or sm.uv|int == 1
              or sm.peltier|int == 1
              or sm.vent_open|int == 1
              or fan_speed > 0.01
              or fan_rpm > 200 %}
            NEVERMORE_SGP_CALIBRATION_ABORT REASON=FINAL_SAFETY_CHECK_FAILED

        {% else %}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"FINALIZING"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 FINALIZING"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 FINALIZING"'
            SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"FINALIZING"'

            CALIBRATE_SGP40 SENSOR=SGP_IN
            CALIBRATE_SGP40 SENSOR=SGP_OUT

            SAVE_VARIABLE VARIABLE=sgp40_calibration_revision VALUE={revision}
            SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=0
            SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=1
            SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"COMPLETE"'
            SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE=0
            SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE=0

            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_revision VALUE={revision}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"COMPLETE"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_reset_applied VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 COMPLETE"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 COMPLETE"'
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"SGP40 CALIBRATION COMPLETE"'

            RESPOND MSG="SGP40 calibration complete; baselines saved and automation remains paused"
            SAVE_CONFIG
        {% endif %}
    {% endif %}


[gcode_macro NEVERMORE_SGP_CALIBRATION_CANCEL]
description: Cancel an active SGP40 calibration and keep Nevermore safely paused
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_PREP DURATION=0
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_GUARD DURATION=0
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_TICK DURATION=0
        UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_FINISH DURATION=0

        # Release the activity latch before shutdown so a Peltier that was
        # still in the initial cooldown may safely keep full airflow.
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
        {% if sm.fault|int == 0 %}
            NEVERMORE_OFF
        {% endif %}

        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"CANCELLED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 CANCELLED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 CANCELLED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"SGP40 CALIBRATION CANCELLED"'

        SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=1
        SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"CANCELLED"'
        SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE=0
        RESPOND MSG="SGP40 calibration cancelled; Nevermore remains paused until automation is resumed"

        {% if sm.sgp40_calibration_reset_applied|int == 1 %}
            RESPOND MSG="Restoring the last saved SGP40 baseline with FIRMWARE_RESTART"
            FIRMWARE_RESTART
        {% endif %}
    {% else %}
        RESPOND MSG="No SGP40 calibration is active"
    {% endif %}


[gcode_macro NEVERMORE_SGP_CALIBRATION_ACKNOWLEDGE]
description: Acknowledge a finished or interrupted calibration and resume automation
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        { action_raise_error("Calibration is still active; cancel it before acknowledging") }
    {% elif sm.sgp40_calibration_reset_applied|int == 1 %}
        { action_raise_error("Run FIRMWARE_RESTART first to restore the last saved SGP40 baseline") }
    {% else %}
        NEVERMORE_AUTO_ENABLE
        RESPOND MSG="SGP40 calibration state acknowledged; Nevermore automation resumed"
    {% endif %}


[gcode_macro NEVERMORE_SGP_CALIBRATION_ABORT]
description: Internal invalidation path for unattended SGP40 calibration
gcode:
    {% set reason = params.REASON|default("ACTIVITY_DETECTED") %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_PREP DURATION=0
    UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_GUARD DURATION=0
    UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_TICK DURATION=0
    UPDATE_DELAYED_GCODE ID=SGP40_CALIBRATION_FINISH DURATION=0

    # Release the activity latch before shutdown so the standard Peltier
    # cooldown path remains available during fault cleanup.
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
    {% if sm.fault|int == 0 %}
        NEVERMORE_OFF
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"INTERRUPTED"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 INTERRUPTED"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 INTERRUPTED"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"SGP40 CALIBRATION INTERRUPTED"'

    SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=0
    SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=1
    SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"INTERRUPTED"'
    SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE=0
    SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE={sm.sgp40_calibration_reset_applied|int}
    RESPOND TYPE=error MSG="SGP40 calibration invalidated: {reason|replace('_', ' ')}"

    {% if sm.sgp40_calibration_reset_applied|int == 1 %}
        RESPOND TYPE=error MSG="Run FIRMWARE_RESTART before resuming automation to restore the last saved SGP40 baseline"
    {% endif %}


[delayed_gcode SGP40_CALIBRATION_RESTORE]
initial_duration: 1
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set active = saved.sgp40_calibration_active|default(0)|int %}
    {% set hold = saved.sgp40_calibration_hold|default(0)|int %}
    {% set phase = saved.sgp40_calibration_phase|default("IDLE") %}
    {% set revision = saved.sgp40_calibration_revision|default(0)|int %}
    {% set reset_applied = saved.sgp40_calibration_reset_applied|default(0)|int %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_revision VALUE={revision}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_reset_applied VALUE=0

    {% if reset_applied == 1 %}
        # Any completed Klipper restart reloads the last saved baseline.
        SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE=0
    {% endif %}

    {% if active == 1 %}
        # The gas-index algorithm's in-memory clean-air learning state does
        # not survive a Klipper restart, so never resume a partial window.
        SAVE_VARIABLE VARIABLE=sgp40_calibration_active VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_hold VALUE=1
        SAVE_VARIABLE VARIABLE=sgp40_calibration_phase VALUE='"INTERRUPTED"'
        SAVE_VARIABLE VARIABLE=sgp40_calibration_remaining VALUE=0
        SAVE_VARIABLE VARIABLE=sgp40_calibration_reset_applied VALUE=0

        NEVERMORE_MANUAL
        NEVERMORE_OFF
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"INTERRUPTED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 INTERRUPTED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 INTERRUPTED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"SGP40 RESTART INTERRUPTION"'
        RESPOND TYPE=error MSG="SGP40 calibration was interrupted by a Klipper or power restart and must be started again"

    {% elif hold == 1 and phase != "IDLE" %}
        NEVERMORE_MANUAL
        NEVERMORE_OFF
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_active VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_hold VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_phase VALUE='"{phase}"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sgp40_calibration_remaining VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 {phase}"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 {phase}"'
    {% endif %}


#####################################################################
# STARTUP
#####################################################################

[delayed_gcode NEVERMORE_AUTO_START]
initial_duration: 3
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set calibration_active = saved.sgp40_calibration_active|default(0)|int %}
    {% set calibration_hold = saved.sgp40_calibration_hold|default(0)|int %}
    {% set calibration_phase = saved.sgp40_calibration_phase|default("IDLE") %}

    {% if calibration_active == 1 or calibration_hold == 1 %}
        NEVERMORE_MANUAL
        NEVERMORE_OFF
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"SGP40 {calibration_phase}"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"SGP40 {calibration_phase}"'
        RESPOND MSG="Nevermore automatic startup held for SGP40 calibration state"
    {% else %}
        NEVERMORE_AUTO_ENABLE
    {% endif %}


#####################################################################
# NEVERMORE MACHINE-READABLE STATUS
#####################################################################

[gcode_macro NEVERMORE_STATUS_JSON]
description: Output Nevermore status as JSON
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% set temp_in = sm.temp_in|float %}
    {% set temp_out = sm.temp_out|float %}
    {% set temp_delta = sm.temp_delta|float %}

    {% set voc_in = sm.voc_in|float %}
    {% set voc_out = sm.voc_out|float %}
    {% set voc_delta = sm.voc_delta|float %}

    {% set fan = printer["fan_generic Filter"].speed|float %}
    {% set rpm = printer["fan_generic Filter"].rpm|float %}
    {% set has_uv = "output_pin uv" in printer %}
    {% set has_peltier = "output_pin peltier" in printer %}
    {% set has_vent = "servo SM_Vent" in printer %}
    {% set uv_capability = 1 if has_uv else 0 %}
    {% set peltier_capability = 1 if has_peltier else 0 %}
    {% set vent_capability = 1 if has_vent else 0 %}

    {% set json =
        '{"state":"' ~ sm.current_state ~
        '","reason":"' ~ sm.auto_reason ~
        '","last_action":"' ~ sm.last_action ~
        '","last_action_time":' ~ sm.last_action_time|int|string ~
        ',"last_action_clock":"' ~ sm.last_action_clock ~ '"' ~
        ',"transition_count":' ~ sm.transition_count|int|string ~
        ',"automation":' ~ sm.auto_mode|int|string ~
        ',"manual_override":' ~ sm.manual_override|int|string ~
        ',"print_active":' ~ sm.print_active|int|string ~
        ',"purge_active":' ~ sm.purge_active|int|string ~
        ',"capabilities":{"uv":' ~ uv_capability|string ~
        ',"peltier":' ~ peltier_capability|string ~
        ',"vent_servo":' ~ vent_capability|string ~ '}' ~
        ',"vent":{"open":' ~ sm.vent_open|int|string ~
        ',"commanded_position":"' ~ ("OPEN" if sm.vent_open|int == 1 else "CLOSED") ~ '"' ~
        ',"closed_ready":' ~ sm.vent_closed_ready|int|string ~
        ',"pending_open":' ~ sm.vent_pending_open|int|string ~ '}' ~
        ',"filter":{"speed":' ~ "%.2f"|format(fan) ~
        ',"rpm":' ~ rpm|int|string ~
        ',"uv":' ~ sm.uv|int|string ~
        ',"peltier":' ~ sm.peltier|int|string ~
        ',"peltier_pending":' ~ sm.peltier_pending_on|int|string ~
        ',"peltier_cooldown":' ~ sm.peltier_cooldown_active|int|string ~
        ',"peltier_interlock":"' ~ sm.peltier_interlock_state ~ '"' ~
        ',"sensor_update_time":' ~ sm.sensor_update_time|int|string ~
        '},"sgp40":{"calibration_active":' ~ sm.sgp40_calibration_active|int|string ~
        ',"calibration_hold":' ~ sm.sgp40_calibration_hold|int|string ~
        ',"calibration_phase":"' ~ sm.sgp40_calibration_phase ~ '"' ~
        ',"calibration_remaining":' ~ sm.sgp40_calibration_remaining|int|string ~
        ',"calibration_duration":' ~ sm.sgp40_calibration_duration|int|string ~
        ',"calibration_revision":' ~ sm.sgp40_calibration_revision|int|string ~
        ',"reset_applied":' ~ sm.sgp40_calibration_reset_applied|int|string ~
        '},"temperature":{"in":' ~ "%.2f"|format(temp_in) ~
        ',"out":' ~ "%.2f"|format(temp_out) ~
        ',"delta":' ~ "%.2f"|format(temp_delta) ~
        '},"voc":{"in":' ~ "%.0f"|format(voc_in) ~
        ',"out":' ~ "%.0f"|format(voc_out) ~
        ',"delta":' ~ "%.0f"|format(voc_delta) ~
        ',"efficiency":' ~ ([0, [100, ((voc_in - voc_out) / voc_in * 100)]|min]|max if voc_in > 0 else 0)|round(1) ~
        ',"warning":' ~ sm.voc_warning|float|string ~
        ',"high":' ~ sm.voc_high|float|string ~
        ',"emergency":' ~ sm.voc_emergency|float|string ~
        ',"state":' ~ sm.voc_state|int|string ~
        '},"thresholds":{"chamber_target":' ~ sm.chamber_target|float|string ~
        ',"chamber_hysteresis":' ~ sm.chamber_hysteresis|float|string ~
        ',"chamber_latched":' ~ sm.chamber_cooling_latched|int|string ~
        ',"voc_idle_hysteresis":' ~ sm.voc_idle_hysteresis|float|string ~
        ',"filter_normal":' ~ sm.filter_normal|float|string ~
        ',"filter_high":' ~ sm.filter_high|float|string ~
        '}}'
    %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=status_json VALUE='{json}'
    RESPOND MSG="{json|replace('"','\\"')}"


#####################################################################
# NEVERMORE SENSOR CACHE UPDATE
#####################################################################

[gcode_macro NEVERMORE_UPDATE_SENSORS]
gcode:
    {% set temp_in = printer["temperature_sensor BME_IN"].temperature|float %}
    {% set temp_out = printer["temperature_sensor BME_OUT"].temperature|float %}

    {% set voc_in = printer["temperature_sensor SGP_IN"].temperature|float %}
    {% set voc_out = printer["temperature_sensor SGP_OUT"].temperature|float %}

    {% set temp_delta = temp_in - temp_out %}
    {% set voc_delta = voc_in - voc_out %}

    {% if voc_in > 0 %}
        {% set efficiency = ((voc_in - voc_out) / voc_in * 100) %}
    {% else %}
        {% set efficiency = 0 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter_efficiency VALUE={ "%.1f"|format(efficiency) }
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=temp_in VALUE={temp_in}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=temp_out VALUE={temp_out}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=temp_delta VALUE={temp_delta}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=sensor_update_time VALUE={printer.toolhead.estimated_print_time}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_in VALUE={voc_in}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_out VALUE={voc_out}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_delta VALUE={voc_delta}
