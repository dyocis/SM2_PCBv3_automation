#####################################################################
# Nevermore StealthMax V2 LED Controller
# Isik's Tech PCB v3
# NeoPixel Ring: neopixel:SM_RGB
# Requires: klipper-led_effect
#####################################################################

#####################################################################
# LED EFFECTS
#####################################################################

[led_effect sm_idle]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    breathing 3 1 top (0.01,0.01,0.01)

[led_effect sm_filter]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    breathing 3 1 top (0.0,0.0,0.5)

[led_effect sm_uv]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    breathing 3 1 top (0.5,0.0,0.5)

[led_effect sm_peltier]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    breathing 3 1 top (0.0,0.5,1.0)

[led_effect sm_filter_uv]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    gradient 0.3 1 add (0.0,0.0,0.5),(0.5,0.0,0.5)

[led_effect sm_filter_peltier]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    gradient 0.3 1 add (0.0,0.0,0.5),(0.0,0.5,1.0)

[led_effect sm_uv_peltier]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    gradient 0.3 1 add (0.5,0.0,0.5),(0.0,0.5,1.0)

[led_effect sm_all]
autostart: false
frame_rate: 24
leds:
    neopixel:SM_RGB
layers:
    gradient 0.3 1 add (0.3,0.0,0.0),(0.0,0.3,0.0),(0.0,0.0,0.3)

[led_effect sm_error]
autostart: false
frame_rate: 24
run_on_error: true
leds:
    neopixel:SM_RGB
layers:
    strobe 1 1.5 add (1.0,1.0,1.0)
    breathing 2 0 top (1.0,0.0,0.0)

#####################################################################
# LED STATE MACHINE
#####################################################################

[gcode_macro UPDATE_SM_STATUS_LEDS]
gcode:
    {% set filter = printer["gcode_macro SM_LED_STATE"].filter|int %}
    {% set uv = printer["gcode_macro SM_LED_STATE"].uv|int %}
    {% set peltier = printer["gcode_macro SM_LED_STATE"].peltier|int %}
    {% set fault = printer["gcode_macro SM_LED_STATE"].fault|int %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}

    {% set pcb = printer["temperature_sensor _SM_PCB"].temperature %}
    {% set mcu = printer["temperature_sensor _SM_MCU"].temperature %}

    STOP_LED_EFFECTS LEDS="neopixel:SM_RGB"

    {% if fault %}
        SET_LED_EFFECT EFFECT=sm_error

    {% elif pcb > settings.pcb_max_temp|float or mcu > settings.mcu_max_temp|float %}
        SET_LED_EFFECT EFFECT=sm_error

    {% elif filter and uv and peltier %}
        SET_LED_EFFECT EFFECT=sm_all

    {% elif filter and uv %}
        SET_LED_EFFECT EFFECT=sm_filter_uv

    {% elif filter and peltier %}
        SET_LED_EFFECT EFFECT=sm_filter_peltier

    {% elif uv and peltier %}
        SET_LED_EFFECT EFFECT=sm_uv_peltier

    {% elif filter %}
        SET_LED_EFFECT EFFECT=sm_filter

    {% elif uv %}
        SET_LED_EFFECT EFFECT=sm_uv

    {% elif peltier %}
        SET_LED_EFFECT EFFECT=sm_peltier

    {% else %}
        SET_LED_EFFECT EFFECT=sm_idle
    {% endif %}

#####################################################################
# HARDWARE STATE COMMANDS
#####################################################################

[gcode_macro SM_FILTER_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter VALUE=1
    UPDATE_SM_STATUS_LEDS

[gcode_macro SM_FILTER_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter VALUE=0
    UPDATE_SM_STATUS_LEDS

[gcode_macro SM_UV_ON]
gcode:
    {% if "output_pin uv" in printer %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=0
        RESPOND MSG="Nevermore UV lights are not installed; LED state remains off"
    {% endif %}
    UPDATE_SM_STATUS_LEDS

[gcode_macro SM_UV_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=0
    UPDATE_SM_STATUS_LEDS

[gcode_macro SM_PELTIER_ON]
gcode:
    {% if "output_pin peltier" in printer and "servo SM_Vent" in printer %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        RESPOND MSG="Nevermore Peltier hardware is unavailable; LED state remains off"
    {% endif %}
    UPDATE_SM_STATUS_LEDS

[gcode_macro SM_PELTIER_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
    UPDATE_SM_STATUS_LEDS

[gcode_macro NEVERMORE_CLEAR_ERROR]
description: Clear Nevermore safety fault
gcode:
    {% if "output_pin peltier" in printer and "servo SM_Vent" not in printer %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fault VALUE=1
        RESPOND TYPE=error MSG="Nevermore fault cannot be cleared: configured Peltier requires the exhaust vent servo"
    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fault VALUE=0
        STOP_LED_EFFECTS LEDS="neopixel:SM_RGB"
        UPDATE_SM_STATUS_LEDS
        RESPOND MSG="Nevermore fault cleared"
    {% endif %}

#####################################################################
# MANUAL LED TEST COMMANDS
#####################################################################

[gcode_macro SM_TEST_IDLE]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:SM_RGB"
    SET_LED_EFFECT EFFECT=sm_idle

[gcode_macro SM_TEST_FILTER]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:SM_RGB"
    SET_LED_EFFECT EFFECT=sm_filter

[gcode_macro SM_TEST_ALL]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:SM_RGB"
    SET_LED_EFFECT EFFECT=sm_all

[gcode_macro SM_TEST_ERROR]
gcode:
    STOP_LED_EFFECTS LEDS="neopixel:SM_RGB"
    SET_LED_EFFECT EFFECT=sm_error

#####################################################################
# STARTUP
#####################################################################

[delayed_gcode SM_LED_STARTUP]
initial_duration: 3
gcode:
    UPDATE_SM_STATUS_LEDS
#####################################################################
