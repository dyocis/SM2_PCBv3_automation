#####################################################################
# Nevermore StealthMax Material Profiles
#
# Material is passed automatically from OrcaSlicer:
#
# PRINT_START ... FILAMENT=[filament_type]
#
# OrcaSlicer material names are normalized by PRINT_START:
# ASA-CF  -> ASA_CF
# PPA-CF  -> PPA_CF
# PA612-CF -> PA612_CF
# PA6-CF  -> PA6_CF
#
#####################################################################

#####################################################################

[gcode_macro NEVERMORE_SET_MATERIAL]
description: Select a Nevermore profile from a slicer material name
gcode:
    {% set material = params.MATERIAL|default(params.FILAMENT|default("UNKNOWN"))|string|upper|replace("-", "_")|replace(" ", "_") %}

    {% if material == "ABS" %}
        NM_PROFILE_ABS
    {% elif material == "ASA" %}
        NM_PROFILE_ASA
    {% elif material == "ASA_CF" %}
        NM_PROFILE_ASA_CF
    {% elif material == "ASA_GF" %}
        NM_PROFILE_ASA_GF
    {% elif material == "PETG" %}
        NM_PROFILE_PETG
    {% elif material == "PLA" %}
        NM_PROFILE_PLA
    {% elif material == "TPU" %}
        NM_PROFILE_TPU
    {% elif material in ["NYLON", "PA", "PA6", "PA12"] %}
        NM_PROFILE_NYLON
    {% elif material == "PPS_CF" %}
        NM_PROFILE_PPS_CF
    {% elif material == "PPA_CF" %}
        NM_PROFILE_PPA_CF
    {% elif material == "PA612_CF" %}
        NM_PROFILE_PA612_CF
    {% elif material == "PA6_CF" %}
        NM_PROFILE_PA6_CF
    {% elif material in ["PC", "POLYCARBONATE"] %}
        NM_PROFILE_PC
    {% else %}
        NEVERMORE_UNKNOWN_MATERIAL MATERIAL={material}
    {% endif %}

#####################################################################
# ABS
#####################################################################

[gcode_macro NM_PROFILE_ABS]
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=print_filter VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_warning VALUE=120
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_high VALUE=220
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_emergency VALUE=400
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_target VALUE=55
    RESPOND MSG="Nevermore Profile: ABS"

