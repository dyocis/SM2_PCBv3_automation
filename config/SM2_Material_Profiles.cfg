#####################################################################
# UNKNOWN MATERIAL
#
# Conservative fallback profile.
#
# Used when:
#   - OrcaSlicer does not provide MATERIAL
#   - MATERIAL is not recognized
#   - A new material has not yet received a dedicated profile
#
# Behavior:
#   - Maximum filtration during printing
#   - Conservative VOC thresholds
#   - Conservative chamber cooling threshold
#
# The print is NOT cancelled.
#####################################################################

[gcode_macro NEVERMORE_UNKNOWN_MATERIAL]
gcode:
    {% set material = params.MATERIAL|default("UNKNOWN")|string %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=print_filter VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_warning VALUE=80
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_high VALUE=150
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=voc_emergency VALUE=300
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=chamber_target VALUE=55

    RESPOND TYPE=error MSG="Nevermore: Unknown material '{material}' - conservative profile active"
