#####################################################################
# Nevermore StealthMax V2 vent and Peltier interlock control
# Hardware sections and per-printer values live in SM2_Local_Hardware.cfg.
#####################################################################

[gcode_macro _VENT_OPEN_NOW]
description: Internal immediate vent-open command; use VENT_OPEN instead
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}

    {% if sm.vent_open|int == 0 or force == 1 %}
        UPDATE_DELAYED_GCODE ID=VENT_CLOSE_READY DURATION=0
        SET_SERVO SERVO=SM_Vent ANGLE={settings.vent_open_angle}
        UPDATE_DELAYED_GCODE ID=VENT_DEACTIVATE DURATION=5
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_open VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_closed_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"VENT OPEN"'

[gcode_macro _VENT_CLOSE_NOW]
description: Internal immediate vent-close command; use VENT_CLOSE instead
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}

    {% if sm.vent_open|int == 1 or force == 1 %}
        SET_SERVO SERVO=SM_Vent ANGLE={settings.vent_close_angle}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_closed_ready VALUE=0
        UPDATE_DELAYED_GCODE ID=VENT_DEACTIVATE DURATION=5
        UPDATE_DELAYED_GCODE ID=VENT_CLOSE_READY DURATION=6
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_open VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"READY"'

[gcode_macro VENT_OPEN]
description: Safely open the vent after Peltier cooldown when required
gcode:
    {% set automatic = params.AUTO|default(0)|int %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}

    {% if sm.sgp40_calibration_active|int == 1 %}
        { action_raise_error("Vent-open request rejected: SGP40 clean-air calibration is active") }
    {% endif %}

    {% if automatic == 0 %}
        NEVERMORE_MANUAL PRESERVE_VENT=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"MANUAL VENT"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"MANUAL VENT"'
    {% endif %}

    # A new vent-open request supersedes any pending Peltier start.
    UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0

    {% if sm.peltier|int == 1 %}
        # The fan must remove stored hot-side heat before exhaust airflow
        # is diverted away from the Peltier heatsink.
        SET_PIN PIN=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        _VENT_CLOSE_NOW FORCE=1
        NEVERMORE_FILTER SPEED=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_active VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"PELTIER COOLDOWN"'
        UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_COOLDOWN_COMPLETE DURATION={settings.peltier_cooldown_seconds}
        RESPOND MSG="Nevermore vent delayed: {settings.peltier_cooldown_seconds|int}-second Peltier cooldown started"

    {% elif sm.peltier_cooldown_active|int == 1 %}
        # Do not restart the timer when the 15-second automation loop repeats.
        NEVERMORE_FILTER SPEED=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'

    {% else %}
        _VENT_OPEN_NOW
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"VENT OPEN"'
    {% endif %}

    UPDATE_SM_STATUS_LEDS

[gcode_macro VENT_CLOSE]
description: Command the StealthMax vent closed and cancel pending opening
gcode:
    {% set automatic = params.AUTO|default(0)|int %}
    {% set force = params.FORCE|default(0)|int %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}

    {% if automatic == 0 %}
        NEVERMORE_MANUAL PRESERVE_VENT=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"MANUAL VENT"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"MANUAL VENT"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"VENT CLOSED"'
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=0
    _VENT_CLOSE_NOW FORCE={force}

    {% if sm.peltier_cooldown_active|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'
    {% elif sm.peltier_pending_on|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"AIRFLOW VERIFY"'
    {% endif %}

    UPDATE_SM_STATUS_LEDS

[delayed_gcode VENT_DEACTIVATE]
gcode:
    SET_SERVO SERVO=SM_Vent WIDTH=0

[delayed_gcode VENT_CLOSE_READY]
gcode:
    {% if printer["gcode_macro SM_LED_STATE"].vent_open|int == 0 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_closed_ready VALUE=1
    {% endif %}
