#####################################################################
# Nevermore StealthMax Control Layer
#
# Required hardware:
#   fan_generic Filter
# Optional hardware (detected at runtime):
#   output_pin uv
#   temperature_sensor SM_UV_LEDs (optional)
#   output_pin peltier (requires servo SM_Vent)
#   servo SM_Vent
#
# Integrates with:
#   SM2_Variables.cfg
#   SM2_LED_Effects.cfg
#   Nevermore automation configuration
#####################################################################


#####################################################################
# FILTER CONTROL
#####################################################################

[gcode_macro NEVERMORE_FILTER]

description: Control Nevermore filter fan

gcode:
    {% set requested_speed = params.SPEED|default(1)|float %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    # Never accept an automatic fan reduction while the cooler is energized,
    # waiting for airflow verification, or in the mandatory fan cooldown.
    {% set heat_source_needs_airflow = sm.peltier|int == 1 or sm.peltier_pending_on|int == 1 or sm.peltier_cooldown_active|int == 1 or sm.uv|int == 1 or sm.uv_cooldown_active|int == 1 %}
    {% set speed = 1.0 if heat_source_needs_airflow else requested_speed %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set previous_speed = sm.last_filter_speed|float %}

    {% if sm.sgp40_calibration_active|int == 1 and speed > 0 %}
        { action_raise_error("Filter start rejected: SGP40 clean-air calibration is active") }
    {% endif %}

    SET_FAN_SPEED FAN=Filter SPEED={speed}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_filter_speed VALUE={speed}

    {% if speed > 0 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter VALUE=1
        {% if previous_speed <= 0 or (speed - previous_speed)|abs > 0.001 or sm.fan_ready|int == 0 %}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fan_start_time VALUE={printer.print_stats.total_duration}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fan_ready VALUE=0
            UPDATE_DELAYED_GCODE ID=NEVERMORE_FAN_READY DURATION={settings.fan_spinup_seconds}
        {% endif %}
    {% else %}
        UPDATE_DELAYED_GCODE ID=NEVERMORE_FAN_READY DURATION=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fan_ready VALUE=0
    {% endif %}

    {% if printer["gcode_macro SM_LED_STATE"].auto_mode|int == 0 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=manual_override VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=current_state VALUE='"MANUAL FILTER"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=auto_reason VALUE='"MANUAL FILTER"'
    {% endif %}

    UPDATE_SM_STATUS_LEDS


[delayed_gcode NEVERMORE_FAN_READY]

gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fan_ready VALUE=1


#####################################################################
# UV CONTROL
#####################################################################

[gcode_macro NEVERMORE_UV]
description: Safe UV control with optional opt-in LED thermistor interlock
gcode:
    {% set value = params.VALUE|default(1)|float %}
    {% set automatic = params.AUTO|default(0)|int %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set has_uv = "output_pin uv" in printer %}
    {% set sensor_present = "temperature_sensor SM_UV_LEDs" in printer %}
    {% set temperature = printer["temperature_sensor SM_UV_LEDs"].temperature|float if sensor_present else -1 %}
    {% set thermal_enabled = settings.uv_thermal_enabled|default(0)|int == 1 %}
    {% set minimum = settings.uv_thermal_min_temp|default(0)|float %}
    {% set maximum = settings.uv_thermal_max_temp|default(0)|float %}
    {% set limits_valid = minimum < maximum %}
    {% set thermal_ok = not thermal_enabled or (sensor_present and limits_valid and minimum <= temperature <= maximum) %}

    {% if not has_uv %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=0
        {% if value > 0 and automatic == 0 %}
            RESPOND MSG="Nevermore UV lights are not installed; request ignored"
        {% endif %}
    {% elif value > 0 %}
        {% if sm.sgp40_calibration_active|int == 1 %}
            { action_raise_error("UV start rejected: SGP40 clean-air calibration is active") }
        {% elif sm.uv_thermal_fault|int == 1 %}
            {% if sm.uv|int == 1 %}
                NEVERMORE_UV_THERMAL_TRIP REASON="LATCHED UV FAULT"
            {% elif automatic == 0 %}
                RESPOND TYPE=error MSG="UV start rejected: thermal fault latched; inspect and reset after cooldown"
            {% endif %}
        {% elif not thermal_ok %}
            # Bad/missing sensor while OFF inhibits; already ON trips UV only.
            {% if sm.uv|int == 1 %}
                NEVERMORE_UV_THERMAL_TRIP REASON="START TEMPERATURE LIMIT"
            {% elif automatic == 0 %}
                RESPOND TYPE=error MSG="UV start inhibited: verify thermistor and LED temperature limits"
            {% endif %}
        {% elif sm.uv_cooldown_active|int == 1 %}
            {% if automatic == 0 %}
                RESPOND TYPE=error MSG="UV start blocked until LED fan cooldown completes"
            {% endif %}
        {% elif sm.fault|int == 1 %}
            {% if automatic == 0 %}
                RESPOND TYPE=error MSG="UV start rejected: global Nevermore fault"
            {% endif %}
        {% else %}
            NEVERMORE_FILTER SPEED=1
            SET_PIN PIN=uv VALUE={value}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=1
        {% endif %}
    {% else %}
        SET_PIN PIN=uv VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=0
        {% if sm.uv|int == 1 and thermal_enabled and sm.uv_cooldown_active|int == 0 %}
            # Opt-in protection retains UV LED airflow after a normal stop.
            NEVERMORE_FILTER SPEED=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_cooldown_active VALUE=1
            UPDATE_DELAYED_GCODE ID=NEVERMORE_UV_COOLDOWN_COMPLETE DURATION={settings.uv_cooldown_seconds|default(60)|float}
        {% endif %}
    {% endif %}
    UPDATE_SM_STATUS_LEDS


[delayed_gcode NEVERMORE_UV_COOLDOWN_COMPLETE]
description: Release UV-only fan hold after the LED cooldown
gcode:
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_cooldown_active VALUE=0
    # Do not force fan off: filtration and Peltier use it independently.
    UPDATE_SM_STATUS_LEDS


[gcode_macro NEVERMORE_UV_THERMAL_TRIP]
description: Isolate UV LEDs without disabling filtration or Peltier
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set reason = params.REASON|default("LED TEMPERATURE LIMIT")|string %}
    {% set was_active = sm.uv|int == 1 %}
    {% if "output_pin uv" in printer %}
        SET_PIN PIN=uv VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_fault VALUE=1
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"FAULT"'
    {% if was_active %}
        NEVERMORE_FILTER SPEED=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_cooldown_active VALUE=1
        UPDATE_DELAYED_GCODE ID=NEVERMORE_UV_COOLDOWN_COMPLETE DURATION={settings.uv_cooldown_seconds|default(60)|float}
    {% endif %}
    RESPOND TYPE=error MSG="UV LEDs isolated: {reason}; filtration and Peltier remain available"
    UPDATE_SM_STATUS_LEDS


[gcode_macro NEVERMORE_UV_THERMAL_RESET]
description: Guarded UV-only thermal latch reset after physical inspection
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set sensor_present = "temperature_sensor SM_UV_LEDs" in printer %}
    {% set temperature = printer["temperature_sensor SM_UV_LEDs"].temperature|float if sensor_present else -1 %}
    {% set minimum = settings.uv_thermal_min_temp|default(0)|float %}
    {% set maximum = settings.uv_thermal_max_temp|default(0)|float %}
    {% set margin = settings.uv_thermal_reset_margin|default(5)|float %}
    {% set limits_valid = minimum < maximum and 0 < margin < (maximum - minimum) %}
    {% if sm.uv|int == 1 or sm.uv_cooldown_active|int == 1 %}
        RESPOND TYPE=error MSG="UV thermal reset refused: output or cooldown is active"
    {% elif not sensor_present or not limits_valid or temperature < minimum or temperature > maximum - margin %}
        RESPOND TYPE=error MSG="UV thermal reset refused: thermistor missing, limits invalid, or LEDs not cool"
    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_fault VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"MONITORING"'
        RESPOND MSG="UV thermal latch cleared; inspect cause before restarting UV"
        UPDATE_SM_STATUS_LEDS
    {% endif %}


#####################################################################
# PELTIER CONTROL
#####################################################################

[gcode_macro NEVERMORE_PELTIER]

description: Interlocked Peltier control requiring closed vent and verified airflow

gcode:
    {% set value = params.VALUE|default(1)|float %}
    {% set automatic = params.AUTO|default(0)|int %}
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set fan_speed = printer["fan_generic Filter"].speed|float %}
    {% set fan_rpm = printer["fan_generic Filter"].rpm|float %}
    {% set has_peltier = "output_pin peltier" in printer %}
    {% set has_vent = "servo SM_Vent" in printer %}
    {% set thermal_enabled = settings.peltier_thermal_enabled|default(0)|int == 1 %}
    {% set sensors_present = "temperature_sensor SM_Peltier_Hot_Side" in printer and "temperature_sensor SM_Peltier_Cold_Side" in printer %}
    {% set hot = printer["temperature_sensor SM_Peltier_Hot_Side"].temperature|float if sensors_present else 0 %}
    {% set cold = printer["temperature_sensor SM_Peltier_Cold_Side"].temperature|float if sensors_present else 0 %}
    {% set hot_min = settings.peltier_hot_min_temp|default(0)|float %}
    {% set hot_max = settings.peltier_hot_max_temp|default(60)|float %}
    {% set cold_min = settings.peltier_cold_min_temp|default(0)|float %}
    {% set cold_max = settings.peltier_cold_max_temp|default(60)|float %}
    {% set limits_valid = hot_min < hot_max and cold_min < cold_max %}
    # When enabled, refuse to energize if either representative sensor is
    # absent, the configured range is invalid, or readings are out of range.
    {% set thermal_ok = not thermal_enabled or (sensors_present and limits_valid and hot_min <= hot <= hot_max and cold_min <= cold <= cold_max) %}

    {% if not has_peltier %}
        UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"N/A"'
        {% if value > 0 and automatic == 0 %}
            RESPOND MSG="Nevermore Peltier add-on is not installed; request ignored"
        {% endif %}

    {% elif not has_vent %}
        SET_PIN PIN=peltier VALUE=0
        UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"FAULT: SERVO REQUIRED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fault VALUE=1
        RESPOND TYPE=error MSG="Peltier request rejected: the required exhaust vent servo is not configured"

    {% else %}
        {% if sm.sgp40_calibration_active|int == 1 and value > 0 %}
            { action_raise_error("Peltier start rejected: SGP40 clean-air calibration is active") }
        {% endif %}

        {% if value > 0 and sm.peltier_thermal_fault|int == 1 %}
            # A latched thermal fault takes priority over a start-temperature
            # inhibit; repeated AUTO requests must never mask this status.
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
            SET_PIN PIN=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL FAULT"'
            {% if automatic == 0 %}
                RESPOND TYPE=error MSG="Peltier request rejected: thermal fault is latched"
            {% endif %}

        {% elif value > 0 and not thermal_ok %}
            # An out-of-range temperature while OFF inhibits startup, not
            # filtration; only an already energized module latches a fault.
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
            {% if sm.peltier|int == 1 %}
                NEVERMORE_PELTIER_THERMAL_TRIP REASON="START TEMPERATURE LIMIT"
            {% else %}
                SET_PIN PIN=peltier VALUE=0
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL INHIBIT"'
                {% if automatic == 0 %}
                    RESPOND TYPE=error MSG="Peltier start inhibited: check thermistor presence, configuration, and temperature limits"
                {% endif %}
            {% endif %}

        {% elif value > 0 %}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0

        {% if sm.fault|int == 1 or sm.peltier_thermal_fault|int == 1 %}
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            {% if sm.peltier_thermal_fault|int == 1 %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL FAULT"'
            {% else %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"FAULT"'
            {% endif %}
            RESPOND TYPE=error MSG="Peltier request rejected: Nevermore or Peltier thermal fault is active"

        {% elif sm.peltier|int == 1 %}
            # Already safely energized. Preserve the established state.
            _VENT_CLOSE_NOW
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER ACTIVE"'

        {% elif sm.peltier_cooldown_active|int == 1 %}
            # Do not re-energize a recently stopped Peltier until the full
            # fan-only cooldown has completed.
            VENT_CLOSE AUTO=1
            NEVERMORE_FILTER SPEED=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'

        {% elif sm.vent_open|int == 1 %}
            # Close the flap, allow its five-second move to complete, and
            # verify measured RPM before the delayed enable is allowed.
            VENT_CLOSE AUTO=1 FORCE=1
            NEVERMORE_FILTER SPEED=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"AIRFLOW VERIFY"'
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION={settings.fan_spinup_seconds|float + 1}

        {% elif sm.vent_closed_ready|int == 1 and fan_speed >= 0.99 and fan_rpm >= settings.minimum_safe_rpm|float %}
            SET_PIN PIN=peltier VALUE={value}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER ACTIVE"'

        {% else %}
            VENT_CLOSE AUTO=1
            NEVERMORE_FILTER SPEED=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"AIRFLOW VERIFY"'
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION={settings.fan_spinup_seconds|float + 1}
        {% endif %}


        {% else %}
            # All OFF requests cancel pending starts. A running Peltier always
            # receives fan-only cooldown, including a temperature-driven AUTO
            # OFF while filtration or UV remain independently active.
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
            SET_PIN PIN=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0

            {% if sm.peltier|int == 1 and sm.peltier_cooldown_active|int == 0 %}
                NEVERMORE_FILTER SPEED=1
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_active VALUE=1
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
                UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_COOLDOWN_COMPLETE DURATION={settings.peltier_cooldown_seconds}
            {% endif %}

            {% if sm.peltier_thermal_fault|int == 1 %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL FAULT"'
            {% elif sm.peltier|int == 1 or sm.peltier_cooldown_active|int == 1 %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'
            {% elif sm.vent_open|int == 1 or sm.vent_pending_open|int == 1 %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"VENT OPEN"'
            {% else %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"READY"'
            {% endif %}
        {% endif %}
    {% endif %}

    UPDATE_SM_STATUS_LEDS


[delayed_gcode NEVERMORE_PELTIER_ENABLE]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set fan_speed = printer["fan_generic Filter"].speed|float %}
    {% set fan_rpm = printer["fan_generic Filter"].rpm|float %}
    {% set has_peltier = "output_pin peltier" in printer %}
    {% set has_vent = "servo SM_Vent" in printer %}
    {% set thermal_enabled = settings.peltier_thermal_enabled|default(0)|int == 1 %}
    {% set sensors_present = "temperature_sensor SM_Peltier_Hot_Side" in printer and "temperature_sensor SM_Peltier_Cold_Side" in printer %}
    {% set hot = printer["temperature_sensor SM_Peltier_Hot_Side"].temperature|float if sensors_present else 0 %}
    {% set cold = printer["temperature_sensor SM_Peltier_Cold_Side"].temperature|float if sensors_present else 0 %}
    {% set hot_min = settings.peltier_hot_min_temp|default(0)|float %}
    {% set hot_max = settings.peltier_hot_max_temp|default(60)|float %}
    {% set cold_min = settings.peltier_cold_min_temp|default(0)|float %}
    {% set cold_max = settings.peltier_cold_max_temp|default(60)|float %}
    {% set limits_valid = hot_min < hot_max and cold_min < cold_max %}
    # When enabled, refuse to energize if either representative sensor is
    # absent, the configured range is invalid, or readings are out of range.
    {% set thermal_ok = not thermal_enabled or (sensors_present and limits_valid and hot_min <= hot <= hot_max and cold_min <= cold <= cold_max) %}

    {% if not has_peltier %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"N/A"'
    {% elif not has_vent %}
        SET_PIN PIN=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"FAULT: SERVO REQUIRED"'
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fault VALUE=1
    {% elif sm.peltier_pending_on|int == 1 and not thermal_ok and sm.peltier_thermal_fault|int == 0 %}
        # A pending start remains OFF. Avoid latching an inactive Peltier
        # fault when chamber heat or sensor configuration blocks activation.
        SET_PIN PIN=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL INHIBIT"'
        RESPOND MSG="Nevermore Peltier start inhibited by thermistor limits"

    {% elif sm.peltier_pending_on|int == 1 %}
        {% if sm.fault|int == 1 or sm.peltier_thermal_fault|int == 1 %}
            SET_PIN PIN=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            {% if sm.peltier_thermal_fault|int == 1 %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL FAULT"'
            {% else %}
                SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"FAULT"'
            {% endif %}

        {% elif sm.vent_open|int == 1 or sm.vent_pending_open|int == 1 %}
            # An open-vent request always wins over a Peltier request.
            SET_PIN PIN=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"VENT OPEN"'

        {% elif sm.peltier_cooldown_active|int == 1 %}
            # The cooldown completion handler will resume this pending request.
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'

        {% elif sm.vent_closed_ready|int == 1 and fan_speed >= 0.99 and fan_rpm >= settings.minimum_safe_rpm|float %}
            SET_PIN PIN=peltier VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER ACTIVE"'
            RESPOND MSG="Nevermore Peltier enabled: vent closed and airflow verified"

        {% else %}
            NEVERMORE_FILTER SPEED=1
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"AIRFLOW VERIFY"'
            UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION={settings.fan_spinup_seconds}
        {% endif %}
    {% endif %}

    UPDATE_SM_STATUS_LEDS


[delayed_gcode NEVERMORE_PELTIER_COOLDOWN_COMPLETE]
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_active VALUE=0

    {% if sm.fault|int == 1 or sm.peltier_thermal_fault|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        _VENT_CLOSE_NOW FORCE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL FAULT"'

    {% elif sm.peltier_pending_on|int == 1 %}
        # A later closed-vent Peltier request superseded the open request.
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        _VENT_CLOSE_NOW FORCE=1
        NEVERMORE_FILTER SPEED=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"AIRFLOW VERIFY"'
        UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION={settings.fan_spinup_seconds|float + 1}

    {% elif sm.vent_pending_open|int == 1 and sm.peltier|int == 0 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        _VENT_OPEN_NOW FORCE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=last_action VALUE='"VENT OPEN"'
        RESPOND MSG="Nevermore Peltier cooldown complete; exhaust vent opened"

    {% elif sm.peltier|int == 1 %}
        NEVERMORE_EMERGENCY_OFF

    {% elif sm.peltier_cooldown_stop_fan|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        _VENT_CLOSE_NOW FORCE=1
        NEVERMORE_FILTER SPEED=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"READY"'
        RESPOND MSG="Nevermore Peltier cooldown complete; Filter fan stopped"

    {% elif sm.vent_open|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"VENT OPEN"'

    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"READY"'
    {% endif %}

    UPDATE_SM_STATUS_LEDS


#####################################################################
# COMBINED COMMANDS
#####################################################################

[gcode_macro NEVERMORE_ON]

description: Enable filter fan

gcode:
    NEVERMORE_FILTER SPEED=1


[gcode_macro NEVERMORE_OFF]

description: Disable all Nevermore functions and close the exhaust vent

gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}

    NEVERMORE_UV VALUE=0
    NEVERMORE_PELTIER VALUE=0
    VENT_CLOSE AUTO=1

    {% if sm.peltier|int == 1 %}
        NEVERMORE_FILTER SPEED=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_active VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"PELTIER COOLDOWN"'
        UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_COOLDOWN_COMPLETE DURATION={settings.peltier_cooldown_seconds}
        RESPOND MSG="Nevermore outputs off; Peltier fan cooldown will run for {settings.peltier_cooldown_seconds|int} seconds"
    {% elif sm.peltier_cooldown_active|int == 1 %}
        NEVERMORE_FILTER SPEED=1
        {% if sm.peltier_thermal_fault|int == 0 %}
            SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=1
        {% endif %}
    {% else %}
        NEVERMORE_FILTER SPEED=0
    {% endif %}


[gcode_macro NEVERMORE_CARBON_COOLING]

description: Enable filter, UV, and Peltier

gcode:
    NEVERMORE_FILTER SPEED=1
    NEVERMORE_UV VALUE=1
    NEVERMORE_PELTIER VALUE=1


#####################################################################
# SAFETY MONITOR
#####################################################################

[delayed_gcode NEVERMORE_SAFETY_MONITOR]

initial_duration: 5

gcode:
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set uv = printer["gcode_macro SM_LED_STATE"].uv|int %}
    {% set peltier = printer["gcode_macro SM_LED_STATE"].peltier|int %}
    {% set vent_open = printer["gcode_macro SM_LED_STATE"].vent_open|int %}

    {% set fan_rpm = printer["fan_generic Filter"].rpm %}

    {% set pcb = printer["temperature_sensor _SM_PCB"].temperature %}
    {% set mcu = printer["temperature_sensor _SM_MCU"].temperature %}

    {% set thermal_enabled = settings.peltier_thermal_enabled|default(0)|int == 1 %}
    {% set sensors_present = "temperature_sensor SM_Peltier_Hot_Side" in printer and "temperature_sensor SM_Peltier_Cold_Side" in printer %}
    {% set hot = printer["temperature_sensor SM_Peltier_Hot_Side"].temperature|float if sensors_present else 0 %}
    {% set cold = printer["temperature_sensor SM_Peltier_Cold_Side"].temperature|float if sensors_present else 0 %}
    {% set hot_min = settings.peltier_hot_min_temp|default(0)|float %}
    {% set hot_max = settings.peltier_hot_max_temp|default(60)|float %}
    {% set cold_min = settings.peltier_cold_min_temp|default(0)|float %}
    {% set cold_max = settings.peltier_cold_max_temp|default(60)|float %}
    {% set limits_valid = hot_min < hot_max and cold_min < cold_max %}
    {% set thermal_fault = thermal_enabled and peltier == 1 and (not sensors_present or not limits_valid or hot < hot_min or hot > hot_max or cold < cold_min or cold > cold_max) %}

    {% set uv_thermal_enabled = settings.uv_thermal_enabled|default(0)|int == 1 %}
    {% set uv_sensor_present = "temperature_sensor SM_UV_LEDs" in printer %}
    {% set uv_temperature = printer["temperature_sensor SM_UV_LEDs"].temperature|float if uv_sensor_present else -1 %}
    {% set uv_min = settings.uv_thermal_min_temp|default(0)|float %}
    {% set uv_max = settings.uv_thermal_max_temp|default(0)|float %}
    {% set uv_limits_valid = uv_min < uv_max %}
    {% set uv_temperature_ok = uv_sensor_present and uv_limits_valid and uv_min <= uv_temperature <= uv_max %}
    {% set uv_thermal_fault = uv_thermal_enabled and uv == 1 and not uv_temperature_ok %}

    # These remain visible whether or not cooling is running. Do not
    # interpret ambient chamber heat as a Peltier fault while switched off.
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_hot_temp VALUE={hot if sensors_present else -1}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cold_temp VALUE={cold if sensors_present else -1}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_led_temp VALUE={uv_temperature}
    {% if printer["gcode_macro SM_LED_STATE"].uv_thermal_fault|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"FAULT"'
    {% elif not uv_sensor_present %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"N/A"'
    {% elif not uv_thermal_enabled %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"MONITOR ONLY"'
    {% elif not uv_temperature_ok %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"THERMAL INHIBIT"'
    {% elif printer["gcode_macro SM_LED_STATE"].uv_cooldown_active|int == 1 %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"COOLDOWN"'
    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_thermal_state VALUE='"READY"'
    {% endif %}

    {% if pcb > settings.pcb_max_temp|float or mcu > settings.mcu_max_temp|float or (peltier and vent_open) %}

        NEVERMORE_EMERGENCY_OFF

    {% elif (uv or peltier)
          and printer["gcode_macro SM_LED_STATE"].fan_ready|int == 1
          and fan_rpm < settings.minimum_safe_rpm|float %}

        NEVERMORE_EMERGENCY_OFF

    {% else %}
        # Separate UV and Peltier faults can trip in the same monitor cycle.
        {% if thermal_fault %}
            NEVERMORE_PELTIER_THERMAL_TRIP REASON="TEMPERATURE LIMIT"
        {% endif %}
        {% if uv_thermal_fault %}
            NEVERMORE_UV_THERMAL_TRIP REASON="LED TEMPERATURE LIMIT"
        {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=NEVERMORE_SAFETY_MONITOR DURATION=5


#####################################################################
# INDEPENDENT PELTIER THERMAL FAULT
# Never disable filtration or UV just because the Peltier overheats.
#####################################################################

[gcode_macro NEVERMORE_PELTIER_THERMAL_TRIP]
description: Isolate the Peltier while retaining filtration
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set reason = params.REASON|default("THERMAL FAULT")|string %}
    {% set was_active = sm.peltier|int == 1 %}
    UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
    {% if "output_pin peltier" in printer %}
        SET_PIN PIN=peltier VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_thermal_fault VALUE=1
    {% if was_active %}
        # Preserve existing Peltier hot-side cooldown; independent fan
        # protection is still required even though cooling is optional.
        _VENT_CLOSE_NOW FORCE=1
        NEVERMORE_FILTER SPEED=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_active VALUE=1
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
        UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_COOLDOWN_COMPLETE DURATION={settings.peltier_cooldown_seconds}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"THERMAL FAULT"'
    RESPOND TYPE=error MSG="Peltier isolated: {reason}; filtration remains available"
    UPDATE_SM_STATUS_LEDS

[gcode_macro NEVERMORE_PELTIER_THERMAL_RESET]
description: Clear Peltier-only thermal latch after inspecting hardware
gcode:
    {% set sm = printer["gcode_macro SM_LED_STATE"] %}
    {% if sm.peltier|int == 1 or sm.peltier_cooldown_active|int == 1 %}
        RESPOND TYPE=error MSG="Peltier reset refused: output or cooldown active"
    {% else %}
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_thermal_fault VALUE=0
        SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"READY"'
        UPDATE_SM_STATUS_LEDS
        RESPOND MSG="Peltier thermal latch cleared; inspect cause before re-enabling"
    {% endif %}


#####################################################################
# EMERGENCY SAFETY SHUTDOWN
#####################################################################

[gcode_macro NEVERMORE_EMERGENCY_OFF]

description: Emergency shutdown of Nevermore accessories

gcode:
    {% set settings = printer["gcode_macro SM2_SETTINGS"] %}
    {% set has_uv = "output_pin uv" in printer %}
    {% set has_peltier = "output_pin peltier" in printer %}
    RESPOND TYPE=error MSG="Nevermore safety shutdown: airflow failure or over-temperature"

    {% if has_uv %}
        SET_PIN PIN=uv VALUE=0
    {% endif %}
    {% if has_peltier %}
        SET_PIN PIN=peltier VALUE=0
    {% endif %}
    UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_ENABLE DURATION=0
    UPDATE_DELAYED_GCODE ID=NEVERMORE_PELTIER_COOLDOWN_COMPLETE DURATION=0
    UPDATE_DELAYED_GCODE ID=NEVERMORE_UV_COOLDOWN_COMPLETE DURATION=0
    VENT_CLOSE AUTO=1 FORCE=1

    # Keep filter running during cooldown
    SET_FAN_SPEED FAN=Filter SPEED=1
    UPDATE_DELAYED_GCODE ID=NEVERMORE_COOLDOWN_OFF DURATION={settings.peltier_cooldown_seconds}

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=uv_cooldown_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=vent_pending_open VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_pending_on VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_cooldown_stop_fan VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=peltier_interlock_state VALUE='"FAULT"'
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fan_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fault VALUE=1

    UPDATE_SM_STATUS_LEDS


#####################################################################
# POST-FAULT FAN COOLDOWN
#####################################################################

[delayed_gcode NEVERMORE_COOLDOWN_OFF]

gcode:
    SET_FAN_SPEED FAN=Filter SPEED=0

    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=filter VALUE=0
    SET_GCODE_VARIABLE MACRO=SM_LED_STATE VARIABLE=fan_ready VALUE=0
