[gcode_macro SM_LED_STATE]

variable_filter: 0
variable_filter_speed: 0
variable_uv: 0
variable_peltier: 0
variable_vent_open: 0
variable_vent_closed_ready: 0
variable_vent_pending_open: 0
variable_peltier_pending_on: 0
variable_peltier_cooldown_active: 0
variable_peltier_cooldown_stop_fan: 0
variable_peltier_interlock_state: "READY"
variable_fault: 0
variable_fan_start_time: 0
variable_fan_ready: 0
variable_temp_delta: 0
variable_voc_delta: 0
variable_temp_in: 0
variable_temp_out: 0
variable_voc_in: 0
variable_voc_out: 0
variable_filter_efficiency: 0

# Automation
variable_auto_mode: 0
variable_manual_override: 0
variable_auto_reason: "IDLE"
variable_current_state: "IDLE"
variable_sensor_update_time: 0

# Unattended SGP40 clean-air calibration
# phase: IDLE, COOLING, CALIBRATING, FINALIZING, COMPLETE,
#        CANCELLED, or INTERRUPTED
variable_sgp40_calibration_active: 0
variable_sgp40_calibration_hold: 0
variable_sgp40_calibration_phase: "IDLE"
variable_sgp40_calibration_remaining: 0
variable_sgp40_calibration_duration: 86400
variable_sgp40_calibration_revision: 0
variable_sgp40_calibration_reset_applied: 0

# Hysteresis state
# voc_state: 0=idle, 1=normal, 2=heavy, 3=emergency
variable_voc_state: 0
variable_chamber_cooling_latched: 0
variable_chamber_hysteresis: 5
variable_voc_idle_hysteresis: 20

#Runtime state
variable_last_filter_speed: 0
variable_last_uv: 0
variable_last_peltier: 0
variable_last_rpm: 0
variable_filter_mode: "OFF"
variable_status_json: 0

# Transition history
variable_last_action: "NONE"
variable_last_action_time: 0
variable_transition_count: 0
variable_last_update: 0
variable_last_action_clock: 0

# Print states
variable_print_active: 0
variable_purge_active: 0

# Material profile values
variable_print_filter: 1
variable_chamber_target: 55
variable_voc_warning: 120
variable_voc_high: 220
variable_voc_emergency: 400
variable_filter_normal: 0.60
variable_filter_high: 1.00

gcode:

