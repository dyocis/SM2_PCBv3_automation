name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/app.js

      - name: Validate repository content
        run: python3 scripts/validate_repo.py

