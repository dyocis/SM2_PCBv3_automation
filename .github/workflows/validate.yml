name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/app.js

      - name: Install dashboard test dependencies
        run: npm ci --prefix dashboard

      - name: Run dashboard tests
        run: npm --prefix dashboard run check

      - name: Test Moonraker CORS configuration
        run: python3 scripts/test_dashboard_cors.py

      - name: Test selective installer regeneration
        run: python3 scripts/test_selective_regeneration.py

      - name: Validate Peltier thermal safety macros (software only)
        run: |
          python3 -m pip install --user Jinja2==3.1.6
          python3 scripts/test_peltier_thermal.py
          python3 scripts/test_temperature_auto.py
          python3 scripts/test_uv_thermal.py

      - name: Validate repository content
        run: python3 scripts/validate_repo.py
