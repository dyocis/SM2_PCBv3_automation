name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vX.Y.Z format" >&2
            exit 1
          fi

      - name: Run repository checks
        run: |
          bash -n scripts/*.sh
          node --check dashboard/app.js
          python3 scripts/validate_repo.py

      - name: Build release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="SM2_PCBv3_automation-${TAG}/" \
            --output="dist/SM2_PCBv3_automation-${TAG}.zip" \
            HEAD
          cd dist
          sha256sum "SM2_PCBv3_automation-${TAG}.zip" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/SM2_PCBv3_automation-${TAG}.zip" \
            "dist/SHA256SUMS" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

